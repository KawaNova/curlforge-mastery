# Google Play Data Safety Declaration for 033_jwt-inspector (JWT Inspector)
data_collection:
  collected: false
  shared: false
  purposes: []
  data_types: []

security_practices:
  data_encrypted_in_transit: true
  can_request_data_deletion: false
  independent_security_review: false

ads:
